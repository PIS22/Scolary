<div class="main-content">
  <form [formGroup]="dataForm" nz-form method="post" (submit)="submit()">
    <nz-form-item>
      <nz-form-label [nzSpan]="3" nzFor="code" nzRequired>Code</nz-form-label>
      <nz-form-control
        [nzSpan]="10"
        [nzOffset]="2"
        nzErrorTip="Le code de l'année scolaire est obligatoire"
      >
        <input
          nz-input
          formControlName="code"
          nz-tooltip="Code de l'année scolaire"
        />
      </nz-form-control>
    </nz-form-item>
    <nz-form-item>
      <nz-form-label [nzSpan]="3" nzFor="libe" nzRequired
        >Libellé</nz-form-label
      >
      <nz-form-control
        [nzSpan]="19"
        [nzOffset]="2"
        nzErrorTip="Le libellé de l'année scolaire est obligatoire"
      >
        <input
          nz-input
          formControlName="libe"
          nz-tooltip="Libellé de l'année scolaire"
        />
      </nz-form-control>
    </nz-form-item>
    <nz-form-item>
      <nz-form-label [nzSpan]="4" nzFor="per" nzRequired>
        Période</nz-form-label
      >
      <nz-form-control [nzSpan]="16" [nzOffset]="1">
        <nz-range-picker
          nzMode=""
          formControlName="per"
          nz-tooltip="Dates de début et de fin de l'année scolaire"
          nzFormat="dd/MM/YYYY"
        ></nz-range-picker>
      </nz-form-control>
    </nz-form-item>
    <nz-form-item nzAlign="middle" nzJustify="center">
      <nz-form-control>
        <button nz-button nzType="primary" [disabled]="dataForm.invalid">
          Valider
        </button>
        <button nz-button (click)="close(null)">Annuler</button>
      </nz-form-control>
    </nz-form-item>
  </form>
</div>
