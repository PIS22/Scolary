<div class="main-content">
    <form [formGroup]="dataForm" nz-form method="post" (submit)="submit()">
      <nz-form-item>
        <nz-form-label [nzSpan]="3" nzFor="code" nzRequired>Code</nz-form-label>
        <nz-form-control
          [nzSpan]="10"
          [nzOffset]="2"
          nzErrorTip="Le code du niveau est obligatoire"
        >
          <input
            nz-input
            formControlName="code"
            nz-tooltip="Code du niveau"
          />
        </nz-form-control>
      </nz-form-item>
      <nz-form-item>
        <nz-form-label [nzSpan]="3" nzFor="libe" nzRequired>Libellé</nz-form-label>
        <nz-form-control
          [nzSpan]="19"
          [nzOffset]="2"
          nzErrorTip="Le libellé du niveau est obligatoire"
        >
          <input
            nz-input
            formControlName="libe"
            nz-tooltip="Libellé du niveau"
          />
        </nz-form-control>
      </nz-form-item>
    <nz-form-item>
      <nz-form-label [nzSpan]="4" nzFor="ord" nzRequired=""> ordre</nz-form-label>
      <nz-form-control [nzSpan]="11" [nzOffset]="1">
        <input type="number" nz-input formControlName="ord"/>
      </nz-form-control>
    </nz-form-item>
      <nz-form-item nzAlign="middle" nzJustify="center">
          <nz-form-control>
            <button nz-button nzType="primary" [disabled]="dataForm.invalid">
              Valider
            </button>
            <button nz-button (click)="close(null)">Annuler</button>
          </nz-form-control>
      </nz-form-item>
    </form>
</div>
